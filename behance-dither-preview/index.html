<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dither Text Reveal — Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
/* The live preview https://dithertextreveal.framer.website rebuilt with its exact component
   settings: a 1200px-wide white page, five sections with 300px top and bottom padding,
   Inter 40px. The page is viewed through a 1200 x 675 window scaled to a 1400 x 788 artboard. */
html, body { margin: 0; height: 100%; background: #fff; }
body { display: grid; place-items: center; overflow: hidden; }
.frame { position: relative; overflow: hidden; }
.artboard { position: absolute; left: 0; top: 0; width: 1400px; height: 788px; background: #fff; overflow: hidden; transform-origin: 0 0; }
.view { width: 1200px; height: 675px; overflow: hidden; transform: scale(1.1666667); transform-origin: 0 0; }
.page { width: 1200px; display: flex; flex-direction: column; align-items: center; will-change: transform; }
.section { width: 100%; display: flex; justify-content: center; align-items: center; padding: 300px 0; }
.reveal { display: flex; flex-direction: column; font-family: 'Inter', 'Inter Placeholder', sans-serif; font-size: 40px; font-weight: 400; letter-spacing: 0px; line-height: 1.4em; }
.reveal > div { white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<div class="frame" id="frame"><div class="artboard" id="artboard"><div class="view" id="view"><div class="page" id="page"></div></div></div></div>
<script>
(function () {
  'use strict';
  // The five component instances on the live preview, with their exact props.
  var SECTIONS = [
    { text: 'Built for impact', charset: 'blocks', scramble: 'rgb(0, 0, 0)', color: 'rgb(0, 0, 0)', align: 'left', order: 'left', reveal: 0.2, trigger: 'mount' },
    { text: 'We build digital experiences \\n that matter', charset: 'blocks', scramble: 'rgb(214, 47, 47)', color: 'rgb(17, 17, 17)', align: 'center', order: 'left', reveal: 0.2, trigger: 'inView' },
    { text: 'Design that feels alive.', charset: 'dither', scramble: 'rgb(25, 0, 255)', color: 'rgb(25, 0, 255)', align: 'left', order: 'left', reveal: 0.2, trigger: 'inView' },
    { text: 'We build digital experiences \\n that matter', charset: 'noise', scramble: 'rgb(138, 138, 138)', color: 'rgb(0, 0, 0)', align: 'center', order: 'center', reveal: 0.2, trigger: 'inView' },
    { text: 'We build digital experiences \\n that matter', charset: 'binary', scramble: 'rgb(71, 71, 71)', color: 'rgb(71, 71, 71)', align: 'center', order: 'left', reveal: 0.3, trigger: 'inView' }
  ];
  var CHARSETS = {
    dither: ['░', '▒', '▓', '█'],
    binary: ['0', '1'],
    blocks: ['▖', '▘', '▝', '▗', '▚', '▞', '▛', '▜', '▟', '▙'],
    noise: ['*', '#', '%', '+', '-', '.', '░', '▒']
  };
  var SWAP = 0.06, VIEW_H = 675;
  // Writing pace, slowed from the component's 0.02 s stagger: each character also scrambles 2.5x longer.
  var STAGGER = 0.05, REVEAL_SCALE = 2.5;
  var LEAD = 0.3, PAUSE = 1.8, SCROLL = 2.6, END_HOLD = 2.0;   // slow, even scroll between phrases

  var page = document.getElementById('page');
  var blocks = SECTIONS.map(function (s, si) {
    var sec = document.createElement('div'); sec.className = 'section';
    var el = document.createElement('div'); el.className = 'reveal';
    el.style.alignItems = { left: 'flex-start', center: 'center', right: 'flex-end' }[s.align];
    el.style.textAlign = s.align;
    var cells = [];
    s.text.replace(/\\n/g, '\n').split('\n').forEach(function (line) {
      var row = document.createElement('div');
      line.split('').forEach(function (ch) {
        var sp = document.createElement('span'); sp.textContent = ch; row.appendChild(sp);
        cells.push({ span: sp, ch: ch });
      });
      el.appendChild(row);
    });
    // Reveal order across the whole text, as in the component.
    var n = cells.length, order = [];
    for (var i = 0; i < n; i++) order.push(i);
    if (s.order === 'center') { var mid = (n - 1) / 2; order.sort(function (a, b) { return Math.abs(a - mid) - Math.abs(b - mid); }); }
    else if (s.order === 'right') order.reverse();
    order.forEach(function (idx, pos) { cells[idx].lockAt = pos * STAGGER + s.reveal * REVEAL_SCALE; });
    sec.appendChild(el); page.appendChild(sec);
    return { s: s, el: el, cells: cells, pool: CHARSETS[s.charset], dur: Math.max.apply(null, cells.map(function (c) { return c.lockAt; })) + SWAP, seed: si * 131 };
  });

  // Camera: pause on each phrase centred in the window, then ease to the next.
  var stops = blocks.map(function (b) { return b.el.offsetTop + b.el.offsetHeight / 2 - VIEW_H / 2; });
  stops[0] = 0;   // the page starts at the top, as on the live site
  var keys = [], t = LEAD + blocks[0].dur + PAUSE;
  for (var k = 1; k < stops.length; k++) { keys.push({ from: stops[k - 1], to: stops[k], start: t }); t += SCROLL + blocks[k].dur + PAUSE; }
  var TOTAL = t - PAUSE + END_HOLD;

  function ease(x) { return -(Math.cos(Math.PI * x) - 1) / 2; }   // gentle sine ease in and out
  function scrollAt(time) {
    var y = 0;
    keys.forEach(function (kf) { if (time >= kf.start) y = kf.from + (kf.to - kf.from) * ease(Math.min(1, (time - kf.start) / SCROLL)); });
    return y;
  }
  function hash(a, b) {
    var h = Math.imul(a + 1, 2654435761) ^ Math.imul(b + 1, 40503);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return (h ^ (h >>> 16)) >>> 0;
  }

  // Trigger time per section: "mount" at load, "inView" the first moment the text touches the
  // centre band of the window (rootMargin -42.5% top and bottom), found by stepping the timeline.
  var bandTop = VIEW_H * 0.425, bandBot = VIEW_H * 0.575;
  blocks.forEach(function (b) {
    if (b.s.trigger === 'mount') { b.start = LEAD; return; }
    var top = b.el.offsetTop, bot = top + b.el.offsetHeight;
    for (var tt = 0; tt <= TOTAL; tt += 1 / 120) {
      var y = scrollAt(tt);
      if (bot - y > bandTop && top - y < bandBot) { b.start = tt; return; }
    }
    b.start = Infinity;
  });

  function render(time) {
    page.style.transform = 'translateY(' + (-scrollAt(time)) + 'px)';
    blocks.forEach(function (b) {
      var e = time - b.start, step = Math.floor(e / SWAP);
      b.cells.forEach(function (c, i) {
        if (e < 0) { c.span.textContent = c.ch; c.span.style.color = 'transparent'; return; }
        if (c.ch === ' ' || e >= c.lockAt) { c.span.textContent = c.ch; c.span.style.color = b.s.color; return; }
        c.span.textContent = b.pool[hash(i + b.seed, step) % b.pool.length];
        c.span.style.color = b.s.scramble;
      });
    });
  }

  var frame = document.getElementById('frame'), artboard = document.getElementById('artboard');
  var capture = /[?&]capture/.test(location.search);
  function fit() {
    var kk = capture ? 1 : Math.min(innerWidth / 1400, innerHeight / 788);
    artboard.style.transform = 'scale(' + kk + ')';
    frame.style.width = 1400 * kk + 'px'; frame.style.height = 788 * kk + 'px';
  }
  fit(); addEventListener('resize', fit);
  if (capture) { window.__TOTAL = TOTAL; window.__render = render; render(0); return; }
  var t0 = 0;
  function tick(now) { if (!t0) t0 = now; var s = (now - t0) / 1000; if (s > TOTAL) { t0 = now; s = 0; } render(s); requestAnimationFrame(tick); }
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () { requestAnimationFrame(tick); });
})();
</script>
</body>
</html>
