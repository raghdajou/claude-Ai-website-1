<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Chat Prompt Slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* The Framer "Codigo" component (AIChatPrompt, Claude style) in its light theme, at its own size
   (as in its Framer preview) on a 1400 x 788 Behance artboard, in Inter. The prompt box is restyled
   after the Foxlytics design ( bold "Ask Foxlytics" prompt, "powered by" line, black send button). Title 2, the prompt and the labels are rewritten for Foxlytics (HR analytics, payroll, projects). */
html, body { margin: 0; height: 100%; background: #f7f7f4; }
body { display: grid; place-items: center; overflow: hidden; }
.frame { position: relative; overflow: hidden; }
.artboard { position: absolute; left: 0; top: 0; width: 1400px; height: 788px; background: #f7f7f4; transform-origin: 0 0; }
.stage { position: absolute; left: 0; top: 0; width: 1400px; height: 788px; }
</style>
<script type="importmap">
{
  "imports": {
    "react": "https://cdn.jsdelivr.net/npm/react@18.3.1/+esm",
    "react/jsx-runtime": "https://cdn.jsdelivr.net/npm/react@18.3.1/jsx-runtime/+esm",
    "react-dom/client": "https://cdn.jsdelivr.net/npm/react-dom@18.3.1/client/+esm",
    "framer-motion": "https://cdn.jsdelivr.net/npm/framer-motion@11.11.17/+esm",
    "framer": "./framer-shim.js"
  }
}
</script>
</head>
<body>
<div class="frame" id="frame"><div class="artboard" id="artboard"><div class="stage" id="stage"></div></div></div>
<script type="module">
import { createElement } from 'react'
import { createRoot } from 'react-dom/client'
import AIChatPrompt from './Codigo.js'

const artboard = document.getElementById('artboard'), frame = document.getElementById('frame')
const capture = /[?&]capture/.test(location.search)
let H = 788
function fit() {
  const k = capture ? 1 : Math.min(innerWidth / 1400, innerHeight / H)
  artboard.style.transform = `scale(${k})`
  frame.style.width = 1400 * k + 'px'; frame.style.height = H * k + 'px'
}
fit(); addEventListener('resize', fit)

await Promise.all(["400 13px Inter", "500 36px Inter", "600 21px Inter"].map((f) => document.fonts.load(f)))

// The component itself draws the input box and the label row (Claude style, light theme).
// Its two titles are drawn here on a timeline that follows the component's own logic
// (typing: each letter fades in over 0.2s, 0.04s apart; each title holds for
// letters x 40ms + 400ms + 2.5s, then fades up and out before the next one types in),
// so the slide plays, and exports, frame for frame.
const FONT = { fontSize: 36, fontWeight: 500, letterSpacing: '-0.02em', lineHeight: '1.2em' }
const TITLES = ['How Can I Help You?', 'Your workforce, one question away.']
createRoot(document.getElementById('stage')).render(createElement(AIChatPrompt, {
  ...AIChatPrompt.defaultProps,
  theme: 'light', font: FONT,
  titleText: '', titleText2: '',
  placeholderText: 'Ask Foxlytics...',
}))

const EXIT = 0.35
const hold = (s) => (s.length * 40 + 400 + 2500) / 1000
const H1 = hold(TITLES[0]), TOTAL = H1 + hold(TITLES[1])
// One cycle, starting where the component switches back to title 1: title 2 fades out,
// title 1 types in, then at H1 it fades out and title 2 types in until the next switch.
const PHASES = [{ start: EXIT, out: H1 }, { start: H1 + EXIT, out: TOTAL }]

function bezier(p1x, p1y, p2x, p2y) {
  const c = (a, b, t) => 3 * a * t * (1 - t) * (1 - t) + 3 * b * t * t * (1 - t) + t * t * t
  return (x) => {
    if (x <= 0) return 0; if (x >= 1) return 1
    let lo = 0, hi = 1, t = x
    for (let i = 0; i < 30; i++) { t = (lo + hi) / 2; if (c(p1x, p2x, t) < x) lo = t; else hi = t }
    return c(p1y, p2y, t)
  }
}
const ease = bezier(0.25, 0.1, 0.25, 1)

// wait for the component's markup, then put the title layer into its (empty) title slot
let slot = null
while (!(slot = document.querySelector('#stage h1'))) await new Promise((r) => setTimeout(r, 30))
const wrap = slot.parentElement
wrap.style.position = 'relative'

// Foxlytics labels under the box, in place of the component's Claude labels (same chip styling,
// icons drawn in the same 256-unit Phosphor style).
const icon = (d) => `<svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`
const LABELS = [
  ['HR Analytics', icon('<path d="M40 216H216"/><path d="M72 176V120"/><path d="M128 176V72"/><path d="M184 176V136"/>')],
  ['Payroll', icon('<rect x="24" y="64" width="208" height="128" rx="8"/><circle cx="128" cy="128" r="28"/><path d="M64 96V160"/><path d="M192 96V160"/>')],
  ['Projects', icon('<path d="M32 80V200H224V96H128L104 64H32Z"/><path d="M32 112H224"/>')],
  ['Team insights', icon('<circle cx="96" cy="104" r="36"/><path d="M32 200C40 168 64 152 96 152S152 168 160 200"/><circle cx="176" cy="88" r="28"/><path d="M168 136C200 136 220 152 228 184"/>')],
  ["Foxlytics' choice", null],
]
const chips = [...document.querySelectorAll('#stage button')].filter((b) => b.querySelector('span') && /Code|Write|Learn|Personal matters|Claude's choice/.test(b.textContent))
chips.forEach((b, i) => {
  const [label, svg] = LABELS[i]
  b.querySelector('span').textContent = label
  if (svg) { const old = b.querySelector('svg'); old.insertAdjacentHTML('afterend', svg); old.nextElementSibling.style.color = getComputedStyle(old).fill || ''; old.remove() }
})
// The prompt box, rebuilt in the Foxlytics style inside the component's own box (which keeps
// its white fill, border and shadow): bold prompt with a blinking cursor, a "powered by" line,
// then + and model icons on the left, model picker, mic and a black send button on the right.
const POP = "'Inter', sans-serif"
const box = document.querySelector('#stage textarea').parentElement
Object.assign(box.style, { borderRadius: '26px', padding: '24px 22px 18px 40px', gap: '0px' })
const stroke = (d, size = 18) => `<svg width="${size}" height="${size}" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`
box.innerHTML = `
  <div style="display:flex;align-items:center;gap:8px;font-family:${POP};font-weight:600;font-size:21px;line-height:1.2;color:#3f3f46;letter-spacing:-0.01em">
    <span>Ask Foxlytics</span><span id="caret" style="display:inline-block;width:2px;height:22px;background:#3f3f46;margin-left:4px"></span><span style="color:#a1a1aa;font-weight:500;margin-left:-4px">...</span>
  </div>
  <div style="margin-top:8px;font-family:${POP};font-size:12.5px;color:#8b8b93">powered by leading AI models</div>
  <div style="margin-top:16px;display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:18px;color:#27272a">
      ${stroke('<path d="M40 128H216"/><path d="M128 40V216"/>')}
      ${stroke('<path d="M128 24L224 76V180L128 232L32 180V76Z"/><path d="M32 76L128 128L224 76"/><path d="M128 128V232"/>')}
    </div>
    <div style="display:flex;align-items:center;gap:16px;font-family:${POP};font-size:13px">
      <span style="color:#52525b;font-weight:500">Sunnet 5.3</span>
      <span style="color:#a1a1aa;display:flex;align-items:center;gap:4px">High ${stroke('<path d="M208 96L128 176L48 96"/>', 11)}</span>
      <span style="color:#27272a;display:flex">${stroke('<rect x="88" y="24" width="80" height="136" rx="40"/><path d="M200 128a72 72 0 0 1-144 0"/><path d="M128 200V232"/>', 20)}</span>
      <span style="width:36px;height:36px;border-radius:9px;background:#0a0a0a;color:#ffffff;display:flex;align-items:center;justify-content:center">${stroke('<path d="M128 216V48"/><path d="M56 120L128 48L200 120"/>', 20)}</span>
    </div>
  </div>`
const caret = box.querySelector('#caret')
// the labels under the box use the same typeface
chips.forEach((b) => { Object.assign(b.style, { fontFamily: POP, fontSize: '12px', padding: '8px 13px', gap: '6px' }) })

const titleEls = TITLES.map((text) => {
  const h = document.createElement('h1')
  Object.assign(h.style, { margin: 0, textAlign: 'center', color: '#000000', fontFamily: "'Inter', sans-serif",
    fontSize: '36px', fontWeight: 500, letterSpacing: '-0.02em', lineHeight: '1.2em', whiteSpace: 'nowrap',
    position: 'absolute', left: '50%', top: '50%', transform: 'translate(-50%, -50%)' })
  const spans = text.split('').map((ch) => {
    const s = document.createElement('span')
    s.textContent = ch
    Object.assign(s.style, { display: 'inline-block', whiteSpace: ch === ' ' ? 'pre' : 'normal', opacity: 0 })
    h.appendChild(s); return s
  })
  wrap.appendChild(h)
  return { h, spans, text }
})

function render(time) {
  const t = ((time % TOTAL) + TOTAL) % TOTAL
  caret.style.opacity = (t % 1.06) < 0.53 ? 1 : 0
  titleEls.forEach((T, k) => {
    const { start, out } = PHASES[k]
    // title 2's fade-out runs past the end of the cycle, into the start of the next one
    const u = k === 1 && t < EXIT ? t + TOTAL : t
    const shown = u >= start && u < out + EXIT
    T.h.style.visibility = shown ? 'visible' : 'hidden'
    if (!shown) return
    T.spans.forEach((s, i) => { s.style.opacity = ease((u - start - i * 0.04) / 0.2).toFixed(3) })
    const fade = ease((u - out) / EXIT)
    T.h.style.opacity = (1 - fade).toFixed(3)
    T.h.style.transform = `translate(-50%, calc(-50% + ${(-10 * fade).toFixed(2)}px))`
  })
}
render(0)

if (capture) {
  window.__TOTAL = TOTAL; window.__render = render; window.__H = H
  setTimeout(() => { window.__ready = true }, 1200)   // let the component's own fade-in finish
} else {
  let t0 = 0
  const tick = (now) => { if (!t0) t0 = now; render((now - t0) / 1000); requestAnimationFrame(tick) }
  requestAnimationFrame(tick)
}
</script>
</body>
</html>
