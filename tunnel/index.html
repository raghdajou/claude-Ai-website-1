<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Tunnel</title>
<style>
  html, body { margin: 0; height: 100%; background: #f3f1ec; overflow: hidden; }
  #stage { position: fixed; inset: 0; cursor: grab; touch-action: none; user-select: none; }
  #stage:active { cursor: grabbing; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="stage" role="img" aria-label="A 3D tunnel lined with photos — a garden, a puffin, friends on their phones, wildflowers, lilies, a picnic, a red car, a vase of flowers, yellow lilies, a portrait, a beach and pressed flowers — flowing toward the viewer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  // Each photo with its average colour (measured from the image), used to balance colours.
  var PHOTOS = [
    { src: 'images/garden.jpg',          rgb: [61, 94, 51] },
    { src: 'images/car.jpg',             rgb: [126, 68, 43] },
    { src: 'images/puffin.jpg',          rgb: [153, 165, 101] },
    { src: 'images/vase-flowers.jpg',    rgb: [146, 129, 147] },
    { src: 'images/phones.jpg',          rgb: [113, 112, 103] },
    { src: 'images/yellow-lilies.jpg',   rgb: [192, 190, 135] },
    { src: 'images/wildflowers.jpg',     rgb: [114, 127, 101] },
    { src: 'images/orange-hand-portrait.jpg', rgb: [177, 151, 142] },
    { src: 'images/lilies.jpg',          rgb: [195, 130, 123] },
    { src: 'images/picnic.jpg',          rgb: [161, 159, 147] },
    { src: 'images/yellow-blur.jpg',     rgb: [172, 153, 59] },
    { src: 'images/pressed-flowers.jpg', rgb: [144, 124, 107] },
    { src: 'images/beach.jpg',           rgb: [174, 194, 175] },
    { src: 'images/green-leaves.jpg',    rgb: [117, 140, 71] },
    { src: 'images/pastel-blur.jpg',     rgb: [177, 169, 172] },
    { src: 'images/orange-petals.jpg',   rgb: [216, 82, 10] },
    { src: 'images/pink-swirl.jpg',      rgb: [203, 156, 172] },
    { src: 'images/pink-ice.jpg',        rgb: [211, 194, 242] },
    { src: 'images/orange-petal-macro.jpg', rgb: [226, 158, 77] },
    { src: 'images/flower-bed-blur.jpg', rgb: [152, 138, 82] },
    { src: 'images/red-ink.jpg',         rgb: [167, 47, 53] },
    { src: 'images/soft-blossom.jpg',    rgb: [195, 161, 120] },
    { src: 'images/pink-dahlia.jpg',     rgb: [224, 161, 139] },
    { src: 'images/swan.jpg',            rgb: [131, 169, 165] },
    { src: 'images/snake-portrait.jpg',  rgb: [106, 130, 82] },
    { src: 'images/pale-orchid.jpg',     rgb: [186, 185, 173] },
    { src: 'images/mustard-portrait.jpg', rgb: [117, 78, 36] },
    { src: 'images/sunflowers.jpg',      rgb: [106, 125, 111] },
    { src: 'images/green-glitch.jpg',    rgb: [197, 205, 187] },
    { src: 'images/petal-macro.jpg',     rgb: [153, 136, 110] }
  ];
  var IMAGES = PHOTOS.map(function (p) { return p.src; });

  var RADIUS = 8;            // tunnel radius
  var FRAMES = 10;           // panels around each ring
  var RINGS = 12;            // rings along the tunnel
  var SPACING = 5;           // ring depth
  var DEPTH = RINGS * SPACING;
  var SPEED = 6;             // units per second → one full loop every DEPTH / SPEED = 10s
  var BG = 0xf3f1ec, GRID = 0xc9c4ba; // light mode: warm off-white with soft grey lines

  var capture = /[?&]capture/.test(location.search);
  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage = document.getElementById('stage');

  var renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: capture });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(BG); // the clear colour is shown as-is, so no conversion
  renderer.outputEncoding = THREE.sRGBEncoding;
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  // Colours are converted to linear space so they match on screen with sRGB output.
  scene.fog = new THREE.Fog(new THREE.Color(BG).convertSRGBToLinear(), 18, DEPTH - 4); // far rings fade into the dark
  var camera = new THREE.PerspectiveCamera(85, 1, 0.1, 300);

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  resize();
  window.addEventListener('resize', resize);

  // One curved panel shape, reused by every photo tile.
  var arc = (2 * Math.PI) / FRAMES;
  var tileGeo = new THREE.CylinderGeometry(RADIUS, RADIUS, SPACING * 0.97, 16, 1, true, Math.PI / 2, arc);
  tileGeo.applyMatrix4(new THREE.Matrix4().makeRotationX(Math.PI / 2));
  var lineMat = new THREE.LineBasicMaterial({ color: new THREE.Color(GRID).convertSRGBToLinear() });

  // Seeded random so the layout is identical on every load (and in exported video).
  var seed = 137;
  function rand() { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; }

  // Checkerboard of photo slots, with a few left empty so it feels less mechanical.
  var slots = [];
  for (var r = 0; r < RINGS; r++) {
    slots.push([]);
    for (var f = 0; f < FRAMES; f++) slots[r].push((r + f) % 2 === 0 && rand() > 0.22);
  }

  // ── Arrange photos ──────────────────────────────────────────
  // Rules, in priority order:
  //  1. The same photo never appears within 3 frames around or 3 rings in front/behind
  //     (rings wrap, since the tunnel loops).
  //  2. Every photo is used about the same number of times.
  //  3. Among the rest, pick the photo whose colour differs most from its nearby panels.
  function ringDist(a, b) { var d = Math.abs(a - b) % RINGS; return Math.min(d, RINGS - d); }
  function frameDist(a, b) { var d = Math.abs(a - b) % FRAMES; return Math.min(d, FRAMES - d); }
  function colourDist(a, b) {
    var dr = a[0] - b[0], dg = a[1] - b[1], db = a[2] - b[2];
    return Math.sqrt(2 * dr * dr + 4 * dg * dg + 3 * db * db); // weighted for how eyes see colour
  }

  var assigned = [], uses = PHOTOS.map(function () { return 0; });
  for (var ar = 0; ar < RINGS; ar++) {
    assigned.push([]);
    for (var af = 0; af < FRAMES; af++) assigned[ar].push(-1);
  }
  for (var ri0 = 0; ri0 < RINGS; ri0++) {
    for (var fi0 = 0; fi0 < FRAMES; fi0++) {
      if (!slots[ri0][fi0]) continue;
      var best = -1, bestScore = -Infinity;
      for (var p = 0; p < PHOTOS.length; p++) {
        var clash = false, nearest = Infinity;
        for (var r2 = 0; r2 < RINGS && !clash; r2++) {
          for (var f2 = 0; f2 < FRAMES; f2++) {
            var q = assigned[r2][f2];
            if (q < 0) continue;
            var rd = ringDist(ri0, r2), fd = frameDist(fi0, f2);
            if (q === p && rd <= 3 && fd <= 3) { clash = true; break; }
            if (rd <= 1 && fd <= 2) nearest = Math.min(nearest, colourDist(PHOTOS[p].rgb, PHOTOS[q].rgb));
          }
        }
        if (clash) continue;
        var score = -uses[p] * 1000 + (nearest === Infinity ? 500 : nearest);
        if (score > bestScore) { bestScore = score; best = p; }
      }
      assigned[ri0][fi0] = best;
      uses[best]++;
    }
  }

  function buildRing(ri, textures) {
    var group = new THREE.Group();
    for (var fi = 0; fi < FRAMES; fi++) {
      var angle = (fi / FRAMES) * Math.PI * 2;
      if (slots[ri][fi]) {
        var tex = textures[assigned[ri][fi]];
        var mesh = new THREE.Mesh(tileGeo, new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide }));
        mesh.rotation.z = angle;
        mesh.position.z = -SPACING / 2;
        group.add(mesh);
      }
      var lx = Math.cos(angle) * (RADIUS + 0.05), ly = Math.sin(angle) * (RADIUS + 0.05);
      group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(lx, ly, 0), new THREE.Vector3(lx, ly, -SPACING)
      ]), lineMat));
    }
    var pts = [];
    for (var s = 0; s <= 120; s++) {
      var a = (s / 120) * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a) * (RADIUS + 0.05), Math.sin(a) * (RADIUS + 0.05), 0));
    }
    group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat));
    return group;
  }

  var rings = [];
  function place(offset) {
    for (var i = 0; i < rings.length; i++) {
      var z = -(i * SPACING) + offset;
      z = ((z - 2) % DEPTH + DEPTH) % DEPTH - DEPTH + 2; // wrap into (2 - DEPTH, 2]
      rings[i].position.z = z;
    }
  }

  // ── Interaction (live mode): drag or scroll to fly forward/back ──
  var extra = 0, vel = 0, dragging = false, lastY = 0, pending = 0;
  stage.addEventListener('pointerdown', function (e) {
    dragging = true; lastY = e.clientY; vel = 0; stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    pending += -(e.clientY - lastY) * 0.05; lastY = e.clientY;
  });
  function endDrag() { dragging = false; }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    vel = Math.max(-40, Math.min(40, vel + e.deltaY * 0.06));
  }, { passive: false });

  function start(textures) {
    for (var ri = 0; ri < RINGS; ri++) {
      var g = buildRing(ri, textures);
      scene.add(g);
      rings.push(g);
    }

    if (capture) {
      // Exact frames on demand for video export.
      window.__render = function (t) { place(t * SPEED); renderer.render(scene, camera); };
      window.__layout = { assigned: assigned, uses: uses };
      window.__loop = DEPTH / SPEED;
      window.__ready = true;
      return;
    }

    var last = performance.now(), base = 0;
    (function tick(now) {
      var dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      if (!reducedMotion && !dragging) base += SPEED * dt;
      extra += pending; pending = 0;
      vel *= Math.pow(0.08, dt);
      extra += vel * dt;
      place(base + extra);
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    })(last);
  }

  // Load all photos, then build the tunnel.
  var loader = new THREE.TextureLoader();
  var textures = [], loaded = 0;
  IMAGES.forEach(function (src, i) {
    loader.load(src, function (tex) {
      tex.encoding = THREE.sRGBEncoding;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      textures[i] = tex;
      if (++loaded === IMAGES.length) start(textures);
    });
  });
})();
</script>
</body>
</html>
